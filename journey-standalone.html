<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Memories Recap — Sky to Beach</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      touch-action: manipulation;
    }

    /* INTRO SCREEN */
    #intro {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000;
      transition: opacity 1s ease, visibility 1s;
    }
    #intro.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    #intro-bg {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, #1a1a2e 0%, #000 100%);
      animation: pulse-bg 8s ease-in-out infinite;
    }
    @keyframes pulse-bg {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: #fff;
      border-radius: 50%;
      animation: twinkle var(--dur, 3s) ease-in-out infinite;
      animation-delay: var(--delay, 0s);
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }
    #intro-content {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 0 24px;
      animation: fadeUp 1s ease 0.5s both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    #intro-content h1 {
      font-size: clamp(2rem, 8vw, 3.5rem);
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }
    #intro-content .subtitle {
      font-size: clamp(0.9rem, 4vw, 1.2rem);
      color: rgba(255,255,255,0.7);
      margin-bottom: 6px;
    }
    #intro-content .phase {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.4);
      margin-bottom: 40px;
      text-transform: uppercase;
      letter-spacing: 0.15em;
    }
    #start-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 16px 40px;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 999px;
      color: #fff;
      font-size: 1.1rem;
      font-weight: 500;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.15s ease, background 0.3s;
      animation: fadeUp 0.8s ease 1.2s both;
    }
    #start-btn:active { transform: scale(0.95); }
    #start-btn:hover { background: rgba(255,255,255,0.2); }
    #start-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
      animation: shimmer 2s infinite;
    }
    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
    .hint-text {
      margin-top: 24px;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.3);
      animation: fadeUp 1s ease 2s both;
    }

    /* MAIN JOURNEY */
    #journey {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }

    .scene {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 1s ease;
      pointer-events: none;
    }
    .scene.active {
      opacity: 1;
      pointer-events: auto;
    }
    .scene img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      animation: ken-burns 10s ease-in-out forwards;
    }
    @keyframes ken-burns {
      from { transform: scale(1); }
      to { transform: scale(1.12); }
    }

    /* Gradients */
    .scene::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.15) 40%, transparent 60%, rgba(0,0,0,0.25) 100%);
    }

    /* Scene info */
    .scene-info {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 30px 24px 100px;
      z-index: 10;
      animation: slideUp 0.6s ease 0.3s both;
    }
    .scene.active .scene-info {
      animation: slideUp 0.6s ease 0.3s both;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .scene-line {
      width: 3rem;
      height: 2px;
      background: linear-gradient(to right, rgba(255,255,255,0.8), transparent);
      margin-bottom: 12px;
      animation: expandLine 0.4s ease 0.5s both;
    }
    @keyframes expandLine {
      from { width: 0; }
      to { width: 3rem; }
    }
    .scene-title {
      font-size: clamp(1.8rem, 6vw, 2.5rem);
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.01em;
    }
    .scene-subtitle {
      font-size: 0.7rem;
      color: rgba(255,255,255,0.6);
      text-transform: uppercase;
      letter-spacing: 0.2em;
      margin-top: 4px;
    }
    .scene-desc {
      font-size: 0.95rem;
      color: rgba(255,255,255,0.8);
      margin-top: 12px;
      max-width: 300px;
      line-height: 1.5;
    }

    /* Progress bar */
    #progress {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      padding: 48px 24px 0;
      display: flex;
      gap: 8px;
    }
    .progress-dot {
      flex: 1;
      height: 3px;
      border-radius: 99px;
      transition: background-color 0.5s ease;
    }

    /* Counter */
    #counter {
      position: fixed;
      top: 60px;
      right: 24px;
      z-index: 20;
      font-size: 0.7rem;
      color: rgba(255,255,255,0.5);
      font-family: monospace;
    }

    /* Navigation zones */
    #nav-left, #nav-right {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 33%;
      z-index: 15;
      cursor: pointer;
    }
    #nav-left { left: 0; }
    #nav-right { right: 0; }

    /* Tap hint */
    #tap-hint {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 6px;
      color: rgba(255,255,255,0.35);
      font-size: 0.7rem;
      animation: pulse-hint 2s ease-in-out infinite;
      animation-delay: 3s;
    }
    @keyframes pulse-hint {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }

    /* Swipe arrow */
    #swipe-arrow {
      position: fixed;
      bottom: 32px;
      right: 24px;
      z-index: 20;
      animation: slideRight 1.5s ease-in-out infinite;
      animation-delay: 4s;
      opacity: 0;
    }
    @keyframes slideRight {
      0%, 100% { opacity: 0; transform: translateX(0); }
      50% { opacity: 0.4; transform: translateX(8px); }
    }

    /* Flash transition */
    #flash {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.1s;
    }
    #flash.on {
      opacity: 0.3;
    }
    #flash.fade {
      transition: opacity 0.8s;
      opacity: 0;
    }
  </style>
</head>
<body>

<!-- INTRO -->
<div id="intro">
  <div id="intro-bg"></div>
  <div id="stars"></div>
  <div id="intro-content">
    <h1>Memories Recap</h1>
    <p class="subtitle">Interactive Cinematic Journey</p>
    <p class="phase">Phase 1 — Sky to Beach</p>
    <button id="start-btn" onclick="beginJourney()">
      <span>Tap to Begin</span>
    </button>
    <p class="hint-text">Tap anywhere to transition between scenes</p>
  </div>
</div>

<!-- FLASH -->
<div id="flash"></div>

<!-- PROGRESS -->
<div id="progress"></div>
<div id="counter"></div>

<!-- JOURNEY -->
<div id="journey">
  <div id="nav-left" onclick="prevScene()"></div>
  <div id="nav-right" onclick="nextScene()"></div>
</div>

<!-- TAP HINT -->
<div id="tap-hint">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
  <span>Tap right</span>
</div>
<div id="swipe-arrow">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
</div>

<script>
const SCENES = [
  {
    title: "The Great Descent",
    subtitle: "From Orbit to Earth",
    image: "https://files.manuscdn.com/user_upload_by_module/session_file/310519663861386902/pKAYesXpyGDyJhwO.jpg",
    description: "A journey begins from the edge of space..."
  },
  {
    title: "Breaking Through",
    subtitle: "Through the Clouds",
    image: "https://files.manuscdn.com/user_upload_by_module/session_file/310519663861386902/YyOmqTBoCjzQEujt.jpg",
    description: "The atmosphere reveals itself in layers of light."
  },
  {
    title: "Descending",
    subtitle: "Sky to Sea",
    image: "https://files.manuscdn.com/user_upload_by_module/session_file/310519663861386902/ClheqEUuOptmmPGb.jpg",
    description: "Clouds part as the turquoise ocean emerges below."
  },
  {
    title: "Arrival",
    subtitle: "Tropical Shore",
    image: "https://files.manuscdn.com/user_upload_by_module/session_file/310519663861386902/zVKxuXLYTXfyVzyh.jpg",
    description: "The golden sand welcomes with warmth and light."
  },
  {
    title: "Home",
    subtitle: "Together on the Shore",
    image: "https://files.manuscdn.com/user_upload_by_module/session_file/310519663861386902/NWgsBSeaJQMnYWoh.jpg",
    description: "Memories made together last forever."
  }
];

let current = 0;
let isTransitioning = false;
let autoTimer = null;

// Create stars
function createStars() {
  const container = document.getElementById('stars');
  for (let i = 0; i < 50; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 100 + '%';
    star.style.setProperty('--dur', (2 + Math.random() * 3) + 's');
    star.style.setProperty('--delay', Math.random() * 2 + 's');
    container.appendChild(star);
  }
}
createStars();

// Build progress dots
function buildProgress() {
  const container = document.getElementById('progress');
  SCENES.forEach((_, i) => {
    const dot = document.createElement('div');
    dot.className = 'progress-dot';
    dot.id = 'dot-' + i;
    container.appendChild(dot);
  });
  updateProgress();
}
buildProgress();

// Create scenes
function createScenes() {
  const journey = document.getElementById('journey');
  SCENES.forEach((scene, i) => {
    const el = document.createElement('div');
    el.className = 'scene' + (i === 0 ? ' active' : '');
    el.id = 'scene-' + i;
    el.innerHTML = `
      <img src="${scene.image}" alt="${scene.title}" />
      <div class="scene-info">
        <div class="scene-line"></div>
        <div class="scene-title">${scene.title}</div>
        <div class="scene-subtitle">${scene.subtitle}</div>
        <div class="scene-desc">${scene.description}</div>
      </div>
    `;
    journey.insertBefore(el, journey.firstChild);
  });
}
createScenes();

function updateProgress() {
  SCENES.forEach((_, i) => {
    const dot = document.getElementById('dot-' + i);
    if (i === current) dot.style.backgroundColor = 'rgba(255,255,255,0.9)';
    else if (i < current) dot.style.backgroundColor = 'rgba(255,255,255,0.4)';
    else dot.style.backgroundColor = 'rgba(255,255,255,0.15)';
  });
  document.getElementById('counter').textContent = (current + 1) + '/' + SCENES.length;
}

function goToScene(index) {
  if (isTransitioning || index === current) return;
  isTransitioning = true;

  // Flash
  const flash = document.getElementById('flash');
  flash.className = 'on';
  setTimeout(() => flash.className = 'fade', 100);

  // Switch scene
  setTimeout(() => {
    document.getElementById('scene-' + current).classList.remove('active');
    document.getElementById('scene-' + current).querySelector('img').style.animation = 'none';
    
    current = index;
    document.getElementById('scene-' + current).classList.add('active');
    document.getElementById('scene-' + current).querySelector('img').style.animation = '';
    
    updateProgress();
    isTransitioning = false;
    resetAutoAdvance();
  }, 600);
}

function nextScene() {
  const next = (current + 1) % SCENES.length;
  goToScene(next);
  vibrate();
}

function prevScene() {
  const prev = current === 0 ? SCENES.length - 1 : current - 1;
  goToScene(prev);
  vibrate();
}

function vibrate() {
  if (navigator.vibrate) navigator.vibrate(10);
}

function resetAutoAdvance() {
  clearTimeout(autoTimer);
  autoTimer = setTimeout(() => {
    if (!isTransitioning) nextScene();
  }, 6000);
}

function beginJourney() {
  document.getElementById('intro').classList.add('hidden');
  resetAutoAdvance();
}

// Keyboard nav
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') nextScene();
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') prevScene();
});

// Touch swipe support
let touchStartX = 0;
document.addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
}, { passive: true });
document.addEventListener('touchend', (e) => {
  const diff = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(diff) > 50) {
    if (diff < 0) nextScene();
    else prevScene();
  }
}, { passive: true });
</script>
</body>
</html>
